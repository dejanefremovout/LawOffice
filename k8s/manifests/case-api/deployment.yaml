apiVersion: apps/v1
kind: Deployment
metadata:
  name: case-api
  namespace: lawoffice
  labels:
    app: case-api
    app.kubernetes.io/part-of: lawoffice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: case-api
  template:
    metadata:
      labels:
        app: case-api
    spec:
      initContainers:
        - name: wait-for-cosmos
          image: curlimages/curl:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Cosmos DB emulator..."
              until curl -sk https://cosmos:8081/_explorer/emulator.pem > /dev/null 2>&1; do
                sleep 5
              done
              echo "Cosmos DB emulator is ready."
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
        - name: wait-for-azurite
          image: curlimages/curl:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Azurite..."
              until curl -s http://azurite:10000/ > /dev/null 2>&1; do
                sleep 2
              done
              echo "Azurite is ready."
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
      containers:
        - name: case-api
          image: lawoffice/case-api:local
          imagePullPolicy: Never
          ports:
            - containerPort: 80
              name: http
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: lawoffice-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: ASPNETCORE_URLS
              valueFrom:
                configMapKeyRef:
                  name: lawoffice-config
                  key: ASPNETCORE_URLS
            - name: AzureWebJobsStorage
              valueFrom:
                configMapKeyRef:
                  name: lawoffice-config
                  key: AZURE_WEBJOBS_STORAGE_CONNECTION_STRING
            - name: FUNCTIONS_WORKER_RUNTIME
              valueFrom:
                configMapKeyRef:
                  name: lawoffice-config
                  key: FUNCTIONS_WORKER_RUNTIME
            - name: CosmosSettings__ConnectionString
              valueFrom:
                configMapKeyRef:
                  name: lawoffice-config
                  key: COSMOS_CONNECTION_STRING
            - name: BlobSettings__ConnectionString
              valueFrom:
                configMapKeyRef:
                  name: lawoffice-config
                  key: BLOB_SETTINGS_CONNECTION_STRING
            - name: BlobSettings__PublicSasBaseUri
              valueFrom:
                configMapKeyRef:
                  name: lawoffice-config
                  key: BLOB_PUBLIC_SAS_BASE_URI
            - name: ServiceBusConnectionString
              valueFrom:
                secretKeyRef:
                  name: lawoffice-secrets
                  key: SERVICE_BUS_CONNECTION_STRING
            - name: OpposingPartyDeletedQueueName
              valueFrom:
                configMapKeyRef:
                  name: lawoffice-config
                  key: OPPOSING_PARTY_DELETED_QUEUE_NAME
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: case-api
  namespace: lawoffice
  labels:
    app: case-api
    app.kubernetes.io/part-of: lawoffice
spec:
  selector:
    app: case-api
  ports:
    - name: http
      port: 80
      targetPort: 80

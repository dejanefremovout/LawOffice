apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: lawoffice
  labels:
    app: portal
    app.kubernetes.io/part-of: lawoffice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portal
  template:
    metadata:
      labels:
        app: portal
    spec:
      volumes:
        - name: portal-config
          configMap:
            name: portal-config
      containers:
        - name: portal
          image: lawoffice/portal:local
          imagePullPolicy: Never
          ports:
            - containerPort: 4200
              name: http
          volumeMounts:
            - name: portal-config
              mountPath: /app/public/config.js
              subPath: config.js
              readOnly: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /
              port: 4200
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /
              port: 4200
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: portal
  namespace: lawoffice
  labels:
    app: portal
    app.kubernetes.io/part-of: lawoffice
spec:
  selector:
    app: portal
  ports:
    - name: http
      port: 4200
      targetPort: 4200

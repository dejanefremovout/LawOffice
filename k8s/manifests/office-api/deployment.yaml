apiVersion: apps/v1
kind: Deployment
metadata:
  name: office-api
  namespace: lawoffice
  labels:
    app: office-api
    app.kubernetes.io/part-of: lawoffice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: office-api
  template:
    metadata:
      labels:
        app: office-api
    spec:
      # Init container waits for Cosmos emulator to be ready before starting the API.
      # This replaces the docker-compose depends_on: cosmos: condition: service_started pattern.
      initContainers:
        - name: wait-for-cosmos
          image: curlimages/curl:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Cosmos DB emulator..."
              until curl -sk https://cosmos:8081/_explorer/emulator.pem > /dev/null 2>&1; do
                sleep 5
              done
              echo "Cosmos DB emulator is ready."
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
      containers:
        - name: office-api
          image: lawoffice/office-api:local
          imagePullPolicy: Never  # Use locally-built image from minikube's Docker daemon
          ports:
            - containerPort: 80
              name: http
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: lawoffice-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: ASPNETCORE_URLS
              valueFrom:
                configMapKeyRef:
                  name: lawoffice-config
                  key: ASPNETCORE_URLS
            - name: AzureWebJobsStorage
              valueFrom:
                configMapKeyRef:
                  name: lawoffice-config
                  key: AZURE_WEBJOBS_STORAGE_CONNECTION_STRING
            - name: FUNCTIONS_WORKER_RUNTIME
              valueFrom:
                configMapKeyRef:
                  name: lawoffice-config
                  key: FUNCTIONS_WORKER_RUNTIME
            - name: CosmosSettings__ConnectionString
              valueFrom:
                configMapKeyRef:
                  name: lawoffice-config
                  key: COSMOS_CONNECTION_STRING
            - name: GraphApi__TenantId
              value: "Development"
            - name: GraphApi__ClientId
              value: "Development"
            - name: GraphApi__ClientSecret
              value: "Development"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: office-api
  namespace: lawoffice
  labels:
    app: office-api
    app.kubernetes.io/part-of: lawoffice
spec:
  selector:
    app: office-api
  ports:
    - name: http
      port: 80
      targetPort: 80

# Secret for sensitive configuration.
# The Service Bus connection string must be base64-encoded.
# Replace the placeholder with your real connection string:
#   PowerShell: [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("your-connection-string"))
# The setup script (setup.ps1) handles this automatically.
apiVersion: v1
kind: Secret
metadata:
  name: lawoffice-secrets
  namespace: lawoffice
  labels:
    app.kubernetes.io/part-of: lawoffice
type: Opaque
data:
  SERVICE_BUS_CONNECTION_STRING: ""
